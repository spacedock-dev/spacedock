<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="architecture-title architecture-desc"> <!-- Adapted from spacedock-dev/landing ReviewArchitecture.astro at c371cbb. Same actors and surfaces; explicit result connections added. Colors from the shared design tokens. --><style>
svg { background: oklch(0.135 0.004 250); color-scheme: dark; }
.review-boundary { fill: none; stroke: oklch(0.265 0.008 250); stroke-width: 1; }
.connection { fill: none; stroke: oklch(0.54 0.006 250); stroke-width: 2; }
.peer { stroke-dasharray: 5 5; }
.artifact-path, .result-path { fill: none; stroke-width: 2; }
.artifact-path { stroke: oklch(0.54 0.006 250); }
.result-path { stroke: oklch(0.83 0.14 82); }
.artifact-arrow-head { fill: oklch(0.54 0.006 250); }
.arrow-head { fill: oklch(0.83 0.14 82); }
text { font-family: ui-monospace, monospace; }
.edge-label, .group-title { font-size: 15px; fill: oklch(0.71 0.006 250); }
.node rect { fill: oklch(0.175 0.005 250); stroke: oklch(0.265 0.008 250); stroke-width: 1.5; }
.human rect, .envelope rect { stroke: oklch(0.83 0.14 82); }
.others rect { stroke-dasharray: 5 5; }
.node-title { font-size: 20px; font-weight: 600; fill: oklch(0.93 0.005 250); }
.others .node-title { font-size: 18px; }
.node-detail { font-size: 15px; fill: oklch(0.71 0.006 250); }
</style><title id="architecture-title">Agents send artifacts to Review; feedback returns to the requesting agent</title> <desc id="architecture-desc">Multiple agents, across harnesses, supply artifacts. You review it through Terminal or Web. Other reviewers can comment on Web. Review produces a result identifying the artifact and revision, anchored comments, and any requested decision. The invoking harness delivers the validated result back to the requesting agent. Each agent has its own outgoing artifact arrow and incoming result arrow.</desc> <defs> <marker id="review-result-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"> <path d="M0 0 L10 5 L0 10 Z" class="arrow-head" /> </marker> <marker id="review-artifact-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"> <path d="M0 0 L10 5 L0 10 Z" class="artifact-arrow-head" /> </marker> </defs> <path class="result-path" d="M370 455 H360 V110" /><path class="result-path" d="M480 295 V380" marker-end="url(#review-result-arrow)" /><path class="result-path" d="M580 135 H600 V355 H530 V380" marker-end="url(#review-result-arrow)" /><rect class="review-boundary" x="350" y="20" width="260" height="530" rx="12" /> <text class="group-title" x="480" y="49" text-anchor="middle">Spacedock Review</text> <text class="group-title" x="140" y="35" text-anchor="middle">Your agents</text> <g> <path class="artifact-path" d="M230 80 H350" marker-end="url(#review-artifact-arrow)" /> <path class="result-path" d="M360 110 H230" marker-end="url(#review-result-arrow)" /> </g><g> <path class="artifact-path" d="M230 180 H350" marker-end="url(#review-artifact-arrow)" /> <path class="result-path" d="M360 210 H230" marker-end="url(#review-result-arrow)" /> </g><g> <path class="artifact-path" d="M230 280 H350" marker-end="url(#review-artifact-arrow)" /> <path class="result-path" d="M360 310 H230" marker-end="url(#review-result-arrow)" /> </g> <path class="connection" d="M740 135 H680 V112 H580" /> <path class="connection" d="M740 200 H680 V250 H580" /> <path class="connection peer" d="M740 365 H650 V280 H580" /> <text class="edge-label" x="693" y="350" text-anchor="middle">comments</text> <g class="node agent"> <rect x="50" y="60" width="180" height="70" rx="10" /> <text class="node-title" x="140" y="89" text-anchor="middle">Plan agent</text> <text class="node-detail" x="140" y="113" text-anchor="middle">Codex</text> </g><g class="node agent"> <rect x="50" y="160" width="180" height="70" rx="10" /> <text class="node-title" x="140" y="189" text-anchor="middle">Build agent</text> <text class="node-detail" x="140" y="213" text-anchor="middle">Claude Code</text> </g><g class="node agent"> <rect x="50" y="260" width="180" height="70" rx="10" /> <text class="node-title" x="140" y="289" text-anchor="middle">Docs agent</text> <text class="node-detail" x="140" y="313" text-anchor="middle">Codex</text> </g> <g class="node" data-surface="terminal"> <rect x="380" y="70" width="200" height="85" rx="10" /> <text class="node-title" x="480" y="104" text-anchor="middle">Terminal</text> <text class="node-detail" x="480" y="131" text-anchor="middle">Local review</text> </g><g class="node" data-surface="web"> <rect x="380" y="210" width="200" height="85" rx="10" /> <text class="node-title" x="480" y="244" text-anchor="middle">Web</text> <text class="node-detail" x="480" y="271" text-anchor="middle">Hosted review</text> </g> <g class="node human"> <rect x="740" y="110" width="200" height="140" rx="10" /> <text class="node-title" x="840" y="153" text-anchor="middle">You</text> <text class="node-detail" x="840" y="185" text-anchor="middle">Review the work</text> <text class="node-detail" x="840" y="211" text-anchor="middle">Make the call</text> </g> <g class="node others"> <rect x="740" y="330" width="200" height="70" rx="10" /> <text class="node-title" x="840" y="373" text-anchor="middle">Other reviewers</text> </g> <g class="node envelope"> <rect x="370" y="380" width="220" height="150" rx="10" /> <text class="node-title" x="480" y="410" text-anchor="middle">Review result</text> <text class="node-detail" x="480" y="442" text-anchor="middle">Artifact + revision</text> <text class="node-detail" x="480" y="468" text-anchor="middle">Anchored comments</text> <text class="node-detail" x="480" y="494" text-anchor="middle">Requested decision</text> </g> </svg>