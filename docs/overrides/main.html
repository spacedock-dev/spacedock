{% extends "base.html" %}

<!-- For-agents surface: machine-discoverable head links (not human chrome) to the
     llms.txt index and the AGENTS.md page, so an agent reading the docs site
     discovers the curated machine surface from the document head. There is no
     registered rel for llms.txt yet, so rel="alternate" type="text/markdown" is
     the standards-safe form. -->
{% block extrahead %}
  {{ super() }}
  <link rel="alternate" type="text/markdown" title="llms.txt" href="{{ '/llms.txt' | url }}">
  <link rel="alternate" type="text/markdown" title="AGENTS.md" href="{{ '/agents/' | url }}">
{% endblock %}
