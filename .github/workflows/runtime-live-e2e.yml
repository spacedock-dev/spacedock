# SECURITY MODEL — read before editing.
#
# Triggers: workflow_dispatch (a maintainer triggers it manually) and
# pull_request on `main`. It uses pull_request, NOT pull_request_target, so it
# runs the PR-head version of the workflow and GitHub withholds repo secrets from
# FORK PRs — untrusted fork code cannot exfiltrate live API keys because the
# secrets are simply absent for forks. Workflow-level permissions are read-only.
#
# The offline job carries NO environment and NO secret: it builds + runs the
# default Go suite (the live-tagged test compiles out) as the secret-free gate,
# and runs unconditionally on every PR. Only live jobs declare an `environment:`
# (a required-reviewer approval gate, reviewer = clkao) and read only the
# host-specific secret they need: ANTHROPIC_API_KEY for Claude and
# CODEX_AUTH_JSON/OPENAI_API_KEY for Codex and Pi. Pull requests queue Sonnet 5 and Codex Luna.
# Manual Opus and Pi cadences run only their selected runtime.

name: Runtime Live E2E

on:
  workflow_dispatch:
    inputs:
      live_cadence:
        description: "Select routine Sonnet, Opus pre-release, or optional Pi evidence."
        required: true
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus-pre-release
          - pi
      live_parallel:
        description: "go test -parallel for the Pi common journeys (positive integer; default 4, the standard runner core count)."
        required: false
        type: string
        default: "4"
      claude_version:
        description: "Pin Claude Code to a specific version (e.g. 2.1.107, stable, latest). Empty = installer default."
        required: false
        type: string
        default: ""
      codex_version:
        description: "Pin @openai/codex to a specific version (e.g. 0.136.0). Empty = npm latest."
        required: false
        type: string
        default: ""
  # pull_request (NOT pull_request_target): runs the PR-head version of this
  # workflow, and withholds repo secrets from FORK PRs — a fork's malicious code
  # cannot exfiltrate live API keys because the secrets are simply absent.
  # Same-repo PRs get the secret; the live job stays per-variant environment-gated.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate job: the secret-free offline suite must pass before the live job burns
    # env-approval. NO environment, NO secret. Deterministic harness controls run on
    # this default surface; only tests that launch a real host retain the live tag.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      # The offline suite includes the AC tests that exercise the live steps'
      # clean-log + jsonl-archive shape over a fixture; they invoke the pinned
      # gotestsum, so install it here (sha256-verified) to guarantee those tests
      # RUN — they would otherwise self-skip when gotestsum is absent.
      - name: Install gotestsum
        run: bash .github/scripts/install-gotestsum.sh

      - name: Run offline test suite
        run: go test ./...

      - name: Run deterministic live-harness controls offline
        run: go test ./internal/ensigncycle -count=1 -run 'TestCleanupKeepMovingRootRetainsOnlyFailures|TestCodexLiveRunnerExecArgvEnablesMultiAgentV2|TestCodexLiveRunnerUsesSpacedockFrontDoorBeforeHostArgs|TestAssertRecordedGateHoldLogAcceptsPrepareFirstLifecycle|TestShallowBootFixtureContainsOnlyHeldGate|TestPiLiveSmokePromptRequiresExactStageReportHeading|TestPiLiveEnvDropsForeignRuntimeMarkers|TestPiLiveEnvScrubsAmbientPiSubagentMarkers|TestPiIntercomPackageRootDefaultsBesideSubagents'

  # Pull requests normalize to one Sonnet 5 leg. Manual dispatches choose the
  # routine Sonnet cadence or the separately approved Opus pre-release cadence.
  claude-live:
    if: ${{ github.event_name == 'pull_request' || inputs.live_cadence == 'sonnet' || inputs.live_cadence == 'opus-pre-release' }}
    needs: offline
    # The offline gate runs first without secrets. The selected live leg then
    # waits for its CI-E2E or CI-E2E-OPUS approval.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cadence: ${{ github.event_name == 'pull_request' && 'pull-request' || inputs.live_cadence }}
            model: ${{ (github.event_name == 'pull_request' || inputs.live_cadence == 'sonnet') && 'claude-sonnet-5' || 'claude-opus-4-8' }}
            effort: max
            environment: ${{ (github.event_name == 'pull_request' || inputs.live_cadence == 'sonnet') && 'CI-E2E' || 'CI-E2E-OPUS' }}
    environment:
      name: ${{ matrix.environment }}
    env:
      # Freeze the installed version for the run's duration: the Install step below
      # resolves installer-`latest` ONCE, and this keeps that resolved binary from
      # auto-updating mid-run (a multi-minute test must not drift to a second
      # version partway through — the "Show tool versions" step records the exact
      # version that ran). It no longer holds a PIN: the live lane floats to current
      # Claude (the merged-team floor #396 ships on), so CI tests what users run
      # rather than the retired team-tool-capable 2.1.177 (#395, now retired).
      DISABLE_AUTOUPDATER: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Per-leg artifact root the shared Claude scenario runner writes its
      # stream/final-message artifacts under (claudeLiveArtifactDir reads it). The
      # /${{ matrix.model }} keeps cadence artifacts separate.
      SPACEDOCK_LIVE_ARTIFACT_DIR: ${{ github.workspace }}/live-artifacts/claude/${{ matrix.model }}
      SPACEDOCK_JOURNEY_METRICS_DIR: ${{ github.workspace }}/live-artifacts/journey-metrics/claude/${{ matrix.model }}
    steps:
      - name: Check required secret
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY is required for claude-live." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Claude Code
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          # Empty workflow_dispatch input floats to installer-`latest` — the live
          # lane tests the version users actually run (the merged-team floor #396
          # ships on), not a frozen pin. A maintainer can still override with an
          # explicit version or `stable` via the claude_version dispatch input
          # (the escape hatch to pin a known-good version for a release cut).
          VERSION="${CLAUDE_VERSION:-latest}"
          echo "Installing Claude Code version: $VERSION"
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set Claude maximum effort
        run: |
          set -euo pipefail
          real_claude="$HOME/.local/bin/claude"
          shim_dir="$RUNNER_TEMP/spacedock-claude-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/claude" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${SPACEDOCK_CLAUDE_REAL_BIN:?SPACEDOCK_CLAUDE_REAL_BIN is not set}" --effort max "$@"
          SH
          chmod +x "$shim_dir/claude"
          printf 'SPACEDOCK_CLAUDE_REAL_BIN=%s\n' "$real_claude" >> "$GITHUB_ENV"
          printf '%s\n' "$shim_dir" >> "$GITHUB_PATH"

      - name: Install spacedock candidate
        run: |
          set -euo pipefail

          candidate_dir="$RUNNER_TEMP/spacedock-live-bin"
          candidate_bin="$candidate_dir/spacedock"
          if [ -e "$candidate_bin" ] || [ -L "$candidate_bin" ]; then
            echo "candidate output already exists: $candidate_bin" >&2
            exit 1
          fi
          if [ -e "$candidate_dir" ] || [ -L "$candidate_dir" ]; then
            if [ ! -d "$candidate_dir" ] || [ -L "$candidate_dir" ]; then
              echo "candidate directory is not a physical directory: $candidate_dir" >&2
              exit 1
            fi
            if find "$candidate_dir" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
              echo "candidate directory is not empty: $candidate_dir" >&2
              exit 1
            fi
          else
            mkdir -p "$candidate_dir"
          fi

          GOBIN="$candidate_dir" go install ./cmd/spacedock
          if [ ! -f "$candidate_bin" ] || [ ! -x "$candidate_bin" ] || [ -L "$candidate_bin" ]; then
            echo "installed candidate is not a physical executable: $candidate_bin" >&2
            exit 1
          fi

          candidate_canonical_path="$(realpath "$candidate_bin")"
          checkout_canonical_path="$(realpath "$(git rev-parse --show-toplevel)")"
          case "$candidate_canonical_path" in
            "$checkout_canonical_path"|"$checkout_canonical_path"/*)
              echo "candidate resolves inside checkout: $candidate_canonical_path" >&2
              exit 1
              ;;
          esac

          checkout_revision="$(git rev-parse HEAD)"
          build_metadata="$(go version -m "$candidate_bin")"
          embedded_revision="$(printf '%s\n' "$build_metadata" | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }')"
          vcs_modified="$(printf '%s\n' "$build_metadata" | awk '$1 == "build" && $2 ~ /^vcs.modified=/ { sub(/^vcs.modified=/, "", $2); print $2; exit }')"
          if [ -z "$embedded_revision" ] || [ "$embedded_revision" != "$checkout_revision" ]; then
            echo "embedded revision does not match checkout: embedded=${embedded_revision:-missing} checkout=$checkout_revision" >&2
            exit 1
          fi
          if [ "$vcs_modified" != "false" ]; then
            echo "candidate build reports vcs.modified=${vcs_modified:-missing}" >&2
            exit 1
          fi

          mkdir -p "$SPACEDOCK_LIVE_ARTIFACT_DIR"
          provenance="$SPACEDOCK_LIVE_ARTIFACT_DIR/candidate-binary-provenance.txt"
          {
            printf 'candidate_path=%s\n' "$candidate_bin"
            printf 'candidate_canonical_path=%s\n' "$candidate_canonical_path"
            printf 'checkout_revision=%s\n' "$checkout_revision"
            printf 'embedded_revision=%s\n' "$embedded_revision"
            printf 'vcs_modified=%s\n' "$vcs_modified"
          } > "$provenance"

          printf 'SPACEDOCK_BIN=%s\n' "$candidate_bin" >> "$GITHUB_ENV"
          printf '%s\n' "$candidate_dir" >> "$GITHUB_PATH"

      # gotestsum renders the live test run as a CLEAN step log (a per-package
      # progress view + an `=== Failed` recap listing each failing test with
      # file:line) while writing the full `-json` event stream to a `--jsonfile`
      # archive, from a SINGLE test run — so an FO/ensign reads the small step log
      # for triage and fetches the archived `*-detail.jsonl` only for root cause.
      # It is PINNED to a fixed release and the downloaded prebuilt binary is
      # sha256-verified before use (no `@latest`, no unverified download, and no
      # Go-toolchain change — the prebuilt is decoupled from the build toolchain).
      - name: Install gotestsum
        run: bash .github/scripts/install-gotestsum.sh

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Show tool versions
        run: |
          # No pin to enforce: the live lane floats to current Claude. Record the
          # resolved version (the install step froze it for the run) so a failure
          # is always attributable to a known version, and surface it in the step
          # summary for the regression-sensor read.
          echo "claude version (frozen for this run): $(claude --version)"
          go version
          echo "### Tool versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`claude --version\`: \`$(claude --version)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`go version\`: \`$(go version)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: \`${{ matrix.model }}\`" >> "$GITHUB_STEP_SUMMARY"

      # Archivable per-job config dir under $RUNNER_TEMP, exported to later steps
      # via $GITHUB_ENV. $RUNNER_TEMP is the runtime shell variable (the `runner`
      # CONTEXT is NOT available in a job-level `env:` — the runner is unassigned
      # until the job starts, so referencing it there is a parse-time startup
      # failure). The child claude writes its session jsonl to
      # projects/<slug>/<session>.jsonl HERE (the test honors this via
      # isolatedClaudeEnv), so the Upload step below grabs the structured
      # transcript even on a failed/killed run. The /${{ matrix.model }} segment
      # keeps cadence runs from sharing a config dir.
      - name: Set archivable CLAUDE_CONFIG_DIR
        run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/spacedock-claude-config/${{ matrix.model }}" >> "$GITHUB_ENV"

      # Run all 17 exported common journeys through the Claude transport. The exact
      # prefix selector is shared with Codex and Pi. Go runs at most three Claude
      # journeys concurrently, and every journey runs even when an earlier journey
      # fails. The loose 90-minute timeout is a suite-wide runaway backstop.
      # Output discipline: gotestsum runs the suite ONCE, prints a CLEAN step log
      # (per-package progress + an `=== Failed` recap listing each failing test
      # with file:line — no per-test === RUN / --- PASS firehose) and writes the
      # full `-json` event stream to the `--jsonfile` archive for root-cause
      # retrieval. gotestsum preserves the underlying `go test` exit code, so the
      # step stays red on failure.
      - name: Run live Claude E2E
        env:
          SPACEDOCK_LIVE_MODEL: ${{ matrix.model }}
        run: |
          set -o pipefail
          mkdir -p "$SPACEDOCK_LIVE_ARTIFACT_DIR"
          SPACEDOCK_LIVE_RUNTIME=claude gotestsum --jsonfile live-e2e-detail.jsonl --format pkgname -- -tags live -count=1 -timeout 90m -run '^TestLiveCommon' -parallel 3 ./internal/ensigncycle/

      # Current Claude substrate proofs. Each exact test name owns one claim:
      # merged named-Agent dispatch, explicit bare dispatch, or break-glass recovery
      # after a real helper failure. They share one command and one detail artifact.
      # The 20-minute timeout is the approved total backstop for each matrix leg.
      - name: Run live Claude substrate proofs
        if: ${{ !cancelled() }}
        env:
          SPACEDOCK_LIVE_MODEL: ${{ matrix.model }}
        run: |
          set -o pipefail
          gotestsum --jsonfile claude-substrate-detail.jsonl --format pkgname -- -tags live -count=1 -timeout 20m -run 'TestLiveMergedTeamModeDispatch|TestLiveBareReachable|TestLiveBreakGlassShimRecovery' ./internal/ensigncycle/

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: runtime-live-e2e-claude-live-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/spacedock-live-bin/spacedock
            ./live-e2e-detail.jsonl
            ./claude-substrate-detail.jsonl
            ${{ runner.temp }}/spacedock-claude-config/${{ matrix.model }}/projects
            ${{ runner.temp }}/spacedock-claude-config/${{ matrix.model }}/*/projects
            live-artifacts/claude/**
            live-artifacts/journey-metrics/**
          if-no-files-found: warn

  codex-live:
    if: ${{ github.event_name == 'pull_request' || inputs.live_cadence == 'sonnet' }}
    needs: offline
    runs-on: ubuntu-latest
    environment:
      name: CI-E2E-CODEX
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPACEDOCK_CODEX_LIVE_REQUIRED: "1"
      SPACEDOCK_LIVE_ARTIFACT_DIR: ${{ github.workspace }}/live-artifacts/codex
      SPACEDOCK_JOURNEY_METRICS_DIR: ${{ github.workspace }}/live-artifacts/journey-metrics/codex
    steps:
      - name: Check required secret
        run: |
          if [ -z "${CODEX_AUTH_JSON}" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "CODEX_AUTH_JSON or OPENAI_API_KEY is required for codex-live after CI-E2E-CODEX approval." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Codex CLI
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          if [ -n "$CODEX_VERSION" ]; then
            npm install -g "@openai/codex@$CODEX_VERSION"
          else
            npm install -g @openai/codex
          fi

      # Keep login/status/plugin commands on the real CLI, while pinning only
      # the live runner's `codex exec` invocation. The absolute path prevents
      # the shim from resolving itself through PATH.
      - name: Pin Codex live exec model
        run: |
          set -euo pipefail
          real_codex="$(command -v codex)"
          shim_dir="$RUNNER_TEMP/spacedock-codex-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/codex" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          real_codex="${SPACEDOCK_CODEX_REAL_BIN:?SPACEDOCK_CODEX_REAL_BIN is not set}"
          # The live runner reaches Codex through one of these exact front-door
          # prefixes. Match the subcommand boundary, not an arbitrary token:
          # plugin paths/arguments may legitimately be named "exec".
          case "${1:-}" in
            exec)
              exec "$real_codex" exec --model gpt-5.6-luna -c 'model_reasoning_effort="max"' "${@:2}"
              ;;
            --ask-for-approval)
              if [ "${2:-}" = "on-request" ] && [ "${3:-}" = "exec" ]; then
                exec "$real_codex" "${@:1:3}" --model gpt-5.6-luna -c 'model_reasoning_effort="max"' "${@:4}"
              fi
              ;;
            --dangerously-bypass-approvals-and-sandbox)
              if [ "${2:-}" = "exec" ]; then
                exec "$real_codex" "${@:1:2}" --model gpt-5.6-luna -c 'model_reasoning_effort="max"' "${@:3}"
              fi
              ;;
          esac
          exec "$real_codex" "$@"
          SH
          chmod +x "$shim_dir/codex"
          printf 'SPACEDOCK_CODEX_REAL_BIN=%s\n' "$real_codex" >> "$GITHUB_ENV"
          printf '%s\n' "$shim_dir" >> "$GITHUB_PATH"

      - name: Authenticate Codex
        run: |
          set -euo pipefail
          codex_home="$RUNNER_TEMP/spacedock-codex-auth"
          export CODEX_HOME="$codex_home"
          printf 'CODEX_HOME=%s\n' "$codex_home" >> "$GITHUB_ENV"
          if [ -n "$CODEX_AUTH_JSON" ]; then
            mkdir -p "$CODEX_HOME"
            printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
            chmod 600 "$CODEX_HOME/auth.json"
          else
            printf '%s\n' "$OPENAI_API_KEY" | codex login --with-api-key
          fi
          codex login status

      - name: Build spacedock binary
        run: |
          go build -o ./spacedock ./cmd/spacedock
          echo "SPACEDOCK_BIN=$(pwd)/spacedock" >> "$GITHUB_ENV"
          echo "SPACEDOCK_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # Pinned, sha256-verified gotestsum for the clean log + `-json` archive (see
      # the claude-live job for the rationale).
      - name: Install gotestsum
        run: bash .github/scripts/install-gotestsum.sh

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Install current checkout as Codex plugin
        run: |
          mkdir -p "$SPACEDOCK_LIVE_ARTIFACT_DIR"
          marketplace="$RUNNER_TEMP/spacedock-codex-marketplace"
          mkdir -p "$marketplace/.agents/plugins" "$marketplace/plugins"
          ln -s "$GITHUB_WORKSPACE" "$marketplace/plugins/spacedock"
          cat > "$marketplace/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "spacedock",
            "plugins": [
              {
                "name": "spacedock",
                "source": {
                  "source": "local",
                  "path": "./plugins/spacedock"
                },
                "policy": {
                  "installation": "AVAILABLE",
                  "authentication": "ON_INSTALL"
                },
                "category": "workflow"
              }
            ]
          }
          JSON
          codex plugin marketplace add "$marketplace"
          codex plugin add spacedock@spacedock
          codex plugin list | tee "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-plugin-list.txt"
          if grep -q 'github.com\|ref `next`' "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-plugin-list.txt"; then
            echo "codex-live must not install spacedock from remote next." >&2
            exit 1
          fi
          if ! grep -Fq "$marketplace/plugins/spacedock" "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-plugin-list.txt"; then
            echo "codex-live did not list the current checkout plugin path." >&2
            exit 1
          fi

      # AC-1: the EDGE channel install end-to-end on the real codex CLI. Codex
      # enforces that a marketplace entry's name equals the plugin's own plugin.json
      # `name` (`spacedock`). The OLD channel encoding put the channel in the ENTRY
      # name (`spacedock-edge`), so `codex plugin add spacedock-edge@spacedock` was
      # rejected — the failing-today baseline. The fix puts the channel in the
      # marketplace NAME (`spacedock-edge`) with the entry still `spacedock`, so
      # `codex plugin add spacedock@spacedock-edge` passes. This step proves BOTH on
      # the live host: the old shape still fails (baseline moves the wrong way) and
      # the new shape succeeds (the fix flips it).
      - name: Codex edge channel install (name-match baseline → fix)
        run: |
          # Baseline: the OLD shape — entry named `spacedock-edge` in a marketplace
          # named `spacedock` — must FAIL codex's entry-name vs plugin.json name
          # check. (The plugin's own plugin.json name is `spacedock`.) The baseline's
          # marketplace is ALSO named `spacedock`, which collides with the real
          # `spacedock` marketplace this job already registered ("marketplace
          # 'spacedock' is already added from a different source"). Run the baseline
          # under its OWN isolated CODEX_HOME (a subshell export, scoped to these
          # commands) so the old-shape add can't collide; the fix portion below runs
          # in the job's default CODEX_HOME and integrates with the rest of the job.
          (
            baseline_home="$RUNNER_TEMP/spacedock-codex-baseline-home"
            mkdir -p "$baseline_home"
            export CODEX_HOME="$baseline_home"
            oldmkt="$RUNNER_TEMP/spacedock-codex-oldshape"
            mkdir -p "$oldmkt/.agents/plugins" "$oldmkt/plugins"
            ln -s "$GITHUB_WORKSPACE" "$oldmkt/plugins/spacedock"
            cat > "$oldmkt/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "spacedock",
            "plugins": [
              {
                "name": "spacedock-edge",
                "source": { "source": "local", "path": "./plugins/spacedock" },
                "policy": { "installation": "AVAILABLE", "authentication": "ON_INSTALL" },
                "category": "workflow"
              }
            ]
          }
          JSON
            codex plugin marketplace add "$oldmkt"
            if codex plugin add spacedock-edge@spacedock 2> "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-baseline-err.txt"; then
              echo "BASELINE REGRESSION: codex accepted the old entry-name shape spacedock-edge@spacedock; the name-match constraint this AC depends on no longer holds." >&2
              cat "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-baseline-err.txt" >&2
              exit 1
            fi
            if ! grep -Fq "does not match" "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-baseline-err.txt"; then
              echo "BASELINE add failed, but NOT with the expected name-mismatch error (e.g. a marketplace collision); the baseline must fail for the name-match reason." >&2
              cat "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-baseline-err.txt" >&2
              exit 1
            fi
            echo "Baseline confirmed: codex rejects spacedock-edge@spacedock (entry name != plugin.json name)." | tee -a "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-baseline-err.txt"
          )

          # Fix: the NEW shape — entry still `spacedock`, marketplace named
          # `spacedock-edge` — must SUCCEED. This is the channelMarketplace fix the
          # binary now emits (spacedock@spacedock-edge). It runs in the job's default
          # CODEX_HOME; the `spacedock-edge` marketplace name is distinct from the
          # already-registered `spacedock`, so no collision.
          edgemkt="$RUNNER_TEMP/spacedock-codex-edge-marketplace"
          mkdir -p "$edgemkt/.agents/plugins" "$edgemkt/plugins"
          ln -s "$GITHUB_WORKSPACE" "$edgemkt/plugins/spacedock"
          cat > "$edgemkt/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "spacedock-edge",
            "plugins": [
              {
                "name": "spacedock",
                "source": { "source": "local", "path": "./plugins/spacedock" },
                "policy": { "installation": "AVAILABLE", "authentication": "ON_INSTALL" },
                "category": "workflow"
              }
            ]
          }
          JSON
          codex plugin marketplace add "$edgemkt"
          codex plugin add spacedock@spacedock-edge
          codex plugin list | tee "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-plugin-list.txt"
          if ! grep -Fq "spacedock@spacedock-edge" "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-plugin-list.txt"; then
            echo "codex-live edge install did not list spacedock@spacedock-edge after a successful add." >&2
            exit 1
          fi
          if ! grep -Fq "$edgemkt/plugins/spacedock" "$SPACEDOCK_LIVE_ARTIFACT_DIR/codex-edge-plugin-list.txt"; then
            echo "codex-live edge install did not list the current checkout plugin path." >&2
            exit 1
          fi
          echo "Fix confirmed: codex installed spacedock@spacedock-edge from the spacedock-edge marketplace name."

      - name: Verify Codex resolver against installed plugin
        run: go test ./internal/cli -run TestCodexResolveManifestAgainstInstalledHost

      - name: Show tool versions
        run: |
          codex --version
          go version
          echo "### Codex live tool versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`codex --version\`: \`$(codex --version)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`go version\`: \`$(go version)\`" >> "$GITHUB_STEP_SUMMARY"

      # Clean step log + archived `-json` detail from one run (see the claude-live
      # job for the rationale). Every journey runs after an earlier failure, and
      # gotestsum still preserves the failing go test exit code so the job is red.
      - name: Run live Codex shared scenarios
        run: |
          set -o pipefail
          SPACEDOCK_LIVE_RUNTIME=codex gotestsum --jsonfile codex-shared-scenarios-detail.jsonl --format pkgname -- -tags live -count=1 -timeout 40m -run '^TestLiveCommon' -parallel 3 ./internal/ensigncycle

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: runtime-live-e2e-codex-live
          path: |
            ./spacedock
            ./codex-shared-scenarios-detail.jsonl
            live-artifacts/codex/**
            live-artifacts/journey-metrics/**
          if-no-files-found: warn

  pi-live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_cadence == 'pi' }}
    needs: offline
    runs-on: ubuntu-latest
    environment:
      name: CI-E2E-PI
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPACEDOCK_PI_LIVE_REQUIRED: "1"
      SPACEDOCK_LIVE_ARTIFACT_DIR: ${{ github.workspace }}/live-artifacts/pi
      SPACEDOCK_JOURNEY_METRICS_DIR: ${{ github.workspace }}/live-artifacts/journey-metrics/pi
      PI_OFFLINE: "1"
      SPACEDOCK_PI_LIVE_PARALLEL: ${{ inputs.live_parallel }}
    steps:
      - name: Check required secret
        run: |
          if [ -z "${CODEX_AUTH_JSON}" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "CODEX_AUTH_JSON or OPENAI_API_KEY is required for pi-live after CI-E2E-PI approval." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Pi CLI and substrates
        run: |
          set -euo pipefail

          npm --version
          node --version

          # Compatibility pins: pi-coding-agent 0.80.x requires Node >=22.19 and
          # provides @earendil-works/pi-ai/compat, which pi-subagents 0.35.x loads.
          # Keep these exact pins together; do not let npm's engine-aware resolver
          # fall back to legacy-node20 pi-coding-agent while pi-subagents floats new.
          PI_CODING_AGENT_VERSION="0.80.10"
          PI_CODING_AGENT_INTEGRITY="sha512-aL4apbupCHiVLSXASXvRzH4Q2vmtfrDa+0s909CJuVu/GgGylbDzr7oyF1mPmip5E+VxYYxKWmph4hV04wUcQg=="
          PI_SUBAGENTS_VERSION="0.35.1"
          PI_SUBAGENTS_INTEGRITY="sha512-nIH6liO541FZ1RoeEu58Ligd59tiNw0/ODPgHh7uvx9Dk4UpWH08F84/l1+hXCzUgC85OCmyVtngWkZjcK94Cg=="
          PI_INTERCOM_VERSION="0.6.0"
          PI_INTERCOM_INTEGRITY="sha512-OFPh/DXfPhUUSDLTRJiFPEvw00fOA/spjsxUcXiuCHvb2ZkRL02G8Q91mTd+3d42A9AK8BSmbD0+8imFPuHGoQ=="

          pack_dir="$RUNNER_TEMP/pi-live-npm-packs"
          mkdir -p "$pack_dir"
          verified_pack() {
            local spec="$1"
            local expected_integrity="$2"
            local pack_json actual_integrity filename
            pack_json="$(npm pack "$spec" --pack-destination "$pack_dir" --ignore-scripts --json)"
            actual_integrity="$(printf '%s' "$pack_json" | node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(0,'utf8'))[0]; process.stdout.write(p.integrity)")"
            filename="$(printf '%s' "$pack_json" | node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(0,'utf8'))[0]; process.stdout.write(p.filename)")"
            if [ "$actual_integrity" != "$expected_integrity" ]; then
              echo "integrity mismatch for $spec: expected $expected_integrity got $actual_integrity" >&2
              exit 1
            fi
            printf '%s/%s\n' "$pack_dir" "$filename"
          }

          pi_coding_agent_tgz="$(verified_pack "@earendil-works/pi-coding-agent@$PI_CODING_AGENT_VERSION" "$PI_CODING_AGENT_INTEGRITY")"
          pi_subagents_tgz="$(verified_pack "pi-subagents@$PI_SUBAGENTS_VERSION" "$PI_SUBAGENTS_INTEGRITY")"
          pi_intercom_tgz="$(verified_pack "pi-intercom@$PI_INTERCOM_VERSION" "$PI_INTERCOM_INTEGRITY")"

          npm install -g "$pi_coding_agent_tgz" --ignore-scripts --no-audit --no-fund --omit=dev
          command -v pi
          test -x "$(command -v pi)"
          pi --version
          global_npm_root="$(npm root -g)"
          node -e "const p=require('$global_npm_root/@earendil-works/pi-coding-agent/package.json'); if (p.name !== '@earendil-works/pi-coding-agent') throw new Error('unexpected Pi package name '+p.name); if (p.version !== '$PI_CODING_AGENT_VERSION') throw new Error('unexpected Pi version '+p.version); if (!p.bin || p.bin.pi !== 'dist/cli.js') throw new Error('unexpected Pi bin '+JSON.stringify(p.bin)); console.log('verified '+p.name+'@'+p.version+' bin pi='+p.bin.pi)"

          pi_npm_root="$HOME/.pi/agent/npm"
          mkdir -p "$pi_npm_root"
          npm install --prefix "$pi_npm_root" \
            "$pi_subagents_tgz" \
            "$pi_intercom_tgz" \
            --ignore-scripts --no-audit --no-fund --omit=dev
          node -e "const p=require('$pi_npm_root/node_modules/pi-subagents/package.json'); if (p.name !== 'pi-subagents') throw new Error('unexpected pi-subagents package name '+p.name); if (p.version !== '$PI_SUBAGENTS_VERSION') throw new Error('unexpected pi-subagents version '+p.version); console.log('verified '+p.name+'@'+p.version)"
          node -e "const p=require('$pi_npm_root/node_modules/pi-intercom/package.json'); if (p.name !== 'pi-intercom') throw new Error('unexpected pi-intercom package name '+p.name); if (p.version !== '$PI_INTERCOM_VERSION') throw new Error('unexpected pi-intercom version '+p.version); console.log('verified '+p.name+'@'+p.version)"
          test -f "$pi_npm_root/node_modules/pi-subagents/src/extension/index.ts"
          test -f "$pi_npm_root/node_modules/pi-subagents/skills/pi-subagents/SKILL.md"
          test -f "$pi_npm_root/node_modules/pi-subagents/src/intercom/intercom-bridge.ts"
          test -f "$pi_npm_root/node_modules/pi-intercom/skills/pi-intercom/SKILL.md"
          echo "PI_SUBAGENTS_PACKAGE_ROOT=$pi_npm_root/node_modules/pi-subagents" >> "$GITHUB_ENV"
          echo "PI_INTERCOM_PACKAGE_ROOT=$pi_npm_root/node_modules/pi-intercom" >> "$GITHUB_ENV"

      - name: Guard Pi substrate compatibility
        run: |
          set -euo pipefail

          global_npm_root="$(npm root -g)"
          pi_npm_root="$HOME/.pi/agent/npm"
          GLOBAL_NPM_ROOT="$global_npm_root" \
          PI_AGENT_ROOT="$global_npm_root/@earendil-works/pi-coding-agent" \
          PI_SUBAGENTS_ROOT="$pi_npm_root/node_modules/pi-subagents" \
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');

          function readPackage(root) {
            return JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          }
          function fail(message) {
            console.error(`Pi substrate compatibility guard failed: ${message}`);
            process.exit(1);
          }

          const nodeVersion = process.versions.node.split('.').map(Number);
          if (nodeVersion[0] < 22 || (nodeVersion[0] === 22 && nodeVersion[1] < 19)) {
            fail(`Node ${process.versions.node} does not satisfy pi-coding-agent's >=22.19.0 engine requirement`);
          }

          const agentRoot = process.env.PI_AGENT_ROOT;
          const subagentsRoot = process.env.PI_SUBAGENTS_ROOT;
          const agentPackage = readPackage(agentRoot);
          const subagentsPackage = readPackage(subagentsRoot);
          if (agentPackage.version !== '0.80.10') {
            fail(`expected @earendil-works/pi-coding-agent 0.80.10, got ${agentPackage.version}`);
          }
          if (subagentsPackage.version !== '0.35.1') {
            fail(`expected pi-subagents 0.35.1, got ${subagentsPackage.version}`);
          }

          // pi-ai is usually vendored nested under pi-coding-agent (npm does not hoist it
          // to the global root); check the nested copy pi actually loads first, then the
          // top-level global root. The /compat export is ESM-only (import condition), so
          // probe it with a dynamic import, never require.resolve.
          const piAICandidates = [
            path.join(agentRoot, 'node_modules', '@earendil-works', 'pi-ai'),
            path.join(process.env.GLOBAL_NPM_ROOT, '@earendil-works/pi-ai'),
          ];
          const piAIRoot = piAICandidates.find((candidate) => fs.existsSync(path.join(candidate, 'package.json')));
          if (!piAIRoot) {
            fail(`cannot locate @earendil-works/pi-ai under pi-coding-agent ${agentPackage.version} (checked ${piAICandidates.join(', ')})`);
          }
          const piAIPackage = readPackage(piAIRoot);
          const compatExport = piAIPackage.exports && piAIPackage.exports['./compat'] && piAIPackage.exports['./compat'].import;
          if (!compatExport) {
            fail(`pi-subagents ${subagentsPackage.version} requires @earendil-works/pi-ai/compat, but @earendil-works/pi-ai ${piAIPackage.version} from pi-coding-agent ${agentPackage.version} does not declare that export`);
          }
          const compatPath = path.join(piAIRoot, compatExport);
          if (!fs.existsSync(compatPath)) {
            fail(`@earendil-works/pi-ai/compat resolves to missing file ${compatPath}`);
          }
          import(pathToFileURL(compatPath).href).then(() => {
            console.log(`verified pi-subagents ${subagentsPackage.version} is paired with @earendil-works/pi-ai ${piAIPackage.version}: ${compatPath}`);
          }).catch((error) => {
            fail(`@earendil-works/pi-ai/compat exists but failed to load: ${error.message}`);
          });
          NODE

      - name: Build spacedock binary
        run: |
          go build -o ./spacedock ./cmd/spacedock
          echo "SPACEDOCK_BIN=$(pwd)/spacedock" >> "$GITHUB_ENV"
          echo "SPACEDOCK_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "$(pwd)" >> "$GITHUB_PATH"

      - name: Install gotestsum
        run: bash .github/scripts/install-gotestsum.sh

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Verify Pi current-checkout setup
        run: |
          mkdir -p "$SPACEDOCK_LIVE_ARTIFACT_DIR"
          spacedock doctor --host pi --plugin-dir "$GITHUB_WORKSPACE" | tee "$SPACEDOCK_LIVE_ARTIFACT_DIR/pi-doctor.txt"
          test -f "$GITHUB_WORKSPACE/skills/first-officer/references/pi-first-officer-runtime.md"
          test -f "$GITHUB_WORKSPACE/skills/ensign/references/pi-ensign-runtime.md"
          test -f "$PI_SUBAGENTS_PACKAGE_ROOT/src/extension/index.ts"
          test -f "$PI_SUBAGENTS_PACKAGE_ROOT/skills/pi-subagents/SKILL.md"
          test -f "$PI_SUBAGENTS_PACKAGE_ROOT/src/intercom/intercom-bridge.ts"
          test -f "$PI_INTERCOM_PACKAGE_ROOT/skills/pi-intercom/SKILL.md"

      - name: Show tool versions
        run: |
          pi --version
          go version
          echo "### Pi live tool versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`pi --version\`: \`$(pi --version)\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CODEX_AUTH_JSON" ]; then
            echo "- Model: \`openai-codex/gpt-5.6-luna\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Model: \`openai/gpt-5.6-luna\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Thinking: \`max\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`go version\`: \`$(go version)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run live Pi common journeys
        run: |
          set -o pipefail
          PI_LIVE_PARALLEL="${SPACEDOCK_PI_LIVE_PARALLEL:-4}"
          case "$PI_LIVE_PARALLEL" in
            ''|*[!0-9]*)
              echo "live_parallel must be a positive integer (got \"$PI_LIVE_PARALLEL\")" >&2
              exit 1
              ;;
          esac
          if [ "$PI_LIVE_PARALLEL" -lt 1 ]; then
            echo "live_parallel must be at least 1 (got \"$PI_LIVE_PARALLEL\")" >&2
            exit 1
          fi
          SPACEDOCK_LIVE_RUNTIME=pi gotestsum --jsonfile pi-coverage-detail.jsonl --format pkgname -- -tags live -count=1 -timeout 40m -run '^TestLiveCommon' -failfast -parallel "$PI_LIVE_PARALLEL" ./internal/ensigncycle

      - name: Run live Pi front-door smoke
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          gotestsum --jsonfile pi-front-door-smoke-detail.jsonl --format pkgname -- -tags live -count=1 -timeout 15m -run TestLivePiFrontDoorSmoke ./internal/ensigncycle

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: runtime-live-e2e-pi-live
          path: |
            ./spacedock
            ./pi-coverage-detail.jsonl
            ./pi-front-door-smoke-detail.jsonl
            live-artifacts/pi/**
            live-artifacts/journey-metrics/**
          if-no-files-found: warn


  # AC-3: posts a per-PR delta of this run's journey-cost observations against
  # the latest published release ledger, as a single sticky-updating PR comment
  # (`gh pr comment --edit-last`, so repeated pushes update ONE comment instead
  # of appending a new one). PR-only — a workflow_dispatch run has no PR to
  # comment on. The job waits for both live metric producers and consumes both
  # artifacts, so Codex duration and token changes are visible before release.
  # A job-level permissions block grants pull-requests: write beyond the
  # workflow-level contents: read default; specifying any job-level permissions
  # replaces (not merges with) the workflow default, so contents/actions read
  # are restated here for checkout and cross-job artifact download.
  journey-delta-comment:
    needs: [claude-live, codex-live]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Recover this run's journey metrics
        id: recover_current_metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          warn_and_skip() {
            artifact_name="$1"
            rm -rf "$RUNNER_TEMP/current-run-artifacts" "$RUNNER_TEMP/current-run-metrics"
            echo "::warning::journey metrics artifact $artifact_name is unavailable; skipping journey-cost delta comment" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          mkdir -p "$RUNNER_TEMP/current-run-artifacts"
          for artifact_name in \
            runtime-live-e2e-claude-live-claude-sonnet-5 \
            runtime-live-e2e-codex-live
          do
            if ! artifact_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --paginate \
              --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | [.created_at, .id] | @tsv" \
              | sort -k1,1 -k2,2n | tail -1 | cut -f2)"
            then
              warn_and_skip "$artifact_name"
            fi
            if [ -z "$artifact_id" ]; then
              warn_and_skip "$artifact_name"
            fi

            artifact_zip="$RUNNER_TEMP/current-run-artifact-$artifact_id.zip"
            artifact_dir="$RUNNER_TEMP/current-run-artifacts/$artifact_id"
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$artifact_zip"; then
              warn_and_skip "$artifact_name"
            fi
            if ! unzip -tq "$artifact_zip" >/dev/null; then
              warn_and_skip "$artifact_name"
            fi
            mkdir -p "$artifact_dir"
            if ! unzip -q "$artifact_zip" -d "$artifact_dir"; then
              warn_and_skip "$artifact_name"
            fi
            if ! find "$artifact_dir" -path '*/journey-metrics/*.json' -type f -print -quit | grep -q .; then
              warn_and_skip "$artifact_name"
            fi
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      # Best-effort: no previously published release (or one with no
      # journey-costs asset) means no baseline to diff against. `|| true` /
      # explicit exit-0 branches degrade either gap to a non-fatal skip so a
      # missing baseline never REDs the PR.
      - name: Download the latest published release's journey-cost ledger
        id: download_previous_ledger
        if: steps.recover_current_metrics.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$previous_tag" ] || [ "$previous_tag" = "null" ]; then
            echo "::warning::no published release found; skipping journey-cost delta comment" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh release download "$previous_tag" -p 'journey-costs-*.json' -O "$RUNNER_TEMP/previous-journey-costs.json"; then
            echo "::warning::published release $previous_tag has no journey-costs asset; skipping journey-cost delta comment" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      # download-artifact's merge-multiple flat-copies every matched artifact's
      # files into current-run-artifacts, but PRESERVES each artifact's own
      # internal path prefix (verified against a real run's downloaded zip:
      # the journey-metrics JSON lands several directories deep, not directly
      # under "live-artifacts/journey-metrics/"). A hardcoded exact subpath is
      # brittle to that prefix; find + cp (release.yml's own pattern for the
      # same class of problem) is layout-agnostic — it locates the metrics
      # files wherever they actually landed.
      - name: Locate this run's journey metrics
        if: steps.recover_current_metrics.outputs.found == 'true' && steps.download_previous_ledger.outputs.found == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current-run-metrics"
          find "$RUNNER_TEMP/current-run-artifacts" -path '*/journey-metrics/*.json' -type f -exec cp {} "$RUNNER_TEMP/current-run-metrics/" \;

      - name: Post the journey-cost delta PR comment
        if: steps.recover_current_metrics.outputs.found == 'true' && steps.download_previous_ledger.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run ./cmd/spacedock-release journey-delta "$RUNNER_TEMP/previous-journey-costs.json" \
            --metrics-dir "$RUNNER_TEMP/current-run-metrics" \
            --pr "${{ github.event.pull_request.number }}"
