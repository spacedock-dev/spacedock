# Release build for the spacedock launcher: darwin + linux arm64 + amd64
# tarballs, a checksums file, a GitHub Release, and a Homebrew formula bump on
# the own-tap (the cask carries both darwin and linux URLs; linux may also
# install via install.sh).
version: 2

project_name: spacedock

before:
  hooks:
    - go mod tidy

# One `goreleaser release` on a `v*` tag produces BOTH distribution channels from
# the same source tree: a STABLE binary stamped devBranch=main (installs the
# `main` plugin) and an EDGE binary stamped devBranch=next (installs the `next`
# plugin). The two channels differ ONLY in the devBranch ldflag; everything else
# (goos/goarch matrix, Version stamp, binary name) is identical. The shared fields
# live in a YAML anchor so a future matrix/flag change cannot drift the channels
# apart.
builds:
  - id: spacedock-stable
    main: ./cmd/spacedock
    binary: spacedock
    env:
      - CGO_ENABLED=0
    goos: &channel-goos
      - darwin
      - linux
    goarch: &channel-goarch
      - arm64
      - amd64
    # The version stamp the formula's `test do` asserts. Target is the
    # internal/cli.Version var (NOT main.Version — package main has no Version
    # symbol, so -X main.Version is a silent no-op). Version must be a var, not a
    # const, for the linker to write it. {{.Version}} is goreleaser's
    # git-describe-derived version (the tag on a release, a snapshot string on
    # --snapshot).
    # devBranch selects which marketplace ENTRY the released binary installs (the
    # channel is the entry name, not an @ref into the plugin repo). The STABLE
    # channel stamps `main`, which the binary maps to the `spacedock` entry
    # (tag-pinned in the marketplace repo). The source default stays `next`
    # (frontdoor.go), which maps to the `spacedock-edge` entry, so a `go install
    # …@next` / `--plugin-dir` dev build resolves the edge channel; only this
    # released stable artifact carries the `main` stamp (var, not const, for -X to
    # write it).
    ldflags:
      - -s -w
      - -X github.com/spacedock-dev/spacedock/internal/cli.Version={{ .Version }}
      - -X github.com/spacedock-dev/spacedock/internal/cli.devBranch=main
  - id: spacedock-edge
    main: ./cmd/spacedock
    binary: spacedock
    env:
      - CGO_ENABLED=0
    goos: *channel-goos
    goarch: *channel-goarch
    # The EDGE channel stamps `next`, which the binary maps to the `spacedock-edge`
    # marketplace entry (tracking next HEAD). Same Version stamp as stable; only the
    # devBranch ldflag differs (the sole per-channel knob).
    ldflags:
      - -s -w
      - -X github.com/spacedock-dev/spacedock/internal/cli.Version={{ .Version }}
      - -X github.com/spacedock-dev/spacedock/internal/cli.devBranch=next

archives:
  # Asset name template is the B<->C contract with the homebrew-tap formula and
  # install.sh: spacedock_{version}_{darwin|linux}_{arm64|amd64}.tar.gz, with the
  # bare `spacedock` binary at the archive root (no wrapping directory) so
  # `bin.install "spacedock"` (cask) and install.sh's tar-extract both resolve.
  # One archive per channel build; the edge archive carries an `-edge` suffix so
  # the two channels' assets never collide in the release.
  - id: spacedock-stable
    ids:
      - spacedock-stable
    formats:
      - tar.gz
    # On a `-pre` tag (Prerelease true, IsSnapshot false — a --snapshot build also
    # carries a semver prerelease part but is not a real release) the stable
    # archive gains a `_stable` suffix, so a prerelease never publishes an
    # unsuffixed asset: reaching for "the" default-looking asset is impossible,
    # closing the trap where that asset silently held the stable-stamped binary.
    # A stable tag and a snapshot keep today's name byte-identical (spiked:
    # goreleaser 2.16.0, scratch clone, both channel builds end to end).
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if and .Prerelease (not .IsSnapshot) }}_stable{{ end }}"
    wrap_in_directory: false
  - id: spacedock-edge
    ids:
      - spacedock-edge
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_edge"
    wrap_in_directory: false

checksum:
  # The formula's per-arch sha256 lines are sourced from this file.
  name_template: checksums.txt
  algorithm: sha256

release:
  # `auto` marks the GitHub release as a pre-release (not "latest") when the tag
  # carries a semver pre-release indicator, e.g. v0.23.0-pre. goreleaser's own
  # default is `false`, so without this a -pre tag would publish as a full latest
  # release. This is the signal `homebrew_casks.skip_upload: auto` reads to skip
  # the cask bump for a pre-release; a final vX.Y.Z stays a normal release.
  prerelease: auto
  github:
    owner: spacedock-dev
    name: spacedock

homebrew_casks:
  # Generates + pushes a Homebrew Cask to spacedock-dev/homebrew-tap on each
  # release, pinning the per-arch url + sha256 from the release assets +
  # checksums.txt — the seam the homebrew-tap entity consumes. `brews:` is
  # hard-deprecated at goreleaser v2.16; casks auto-detect the bare `spacedock`
  # binary from the archive root, so no install/test stanza is given. The config
  # defines two casks, but each tag publishes only its matching channel. A final
  # tag publishes `spacedock`. A prerelease tag publishes `spacedock@next`. Each
  # cask pins only its channel archive via `ids: [<archive-id>]`.
  - name: spacedock
    # `auto` skips the cask bump when goreleaser marks the release a pre-release
    # (release.prerelease: auto flags a hyphenated tag like v0.23.0-pre), so a
    # `-pre` cut never advances the stable `spacedock` cask. A final vX.Y.Z is not
    # a pre-release, so the cask still publishes.
    skip_upload: auto
    ids:
      - spacedock-stable
    # Both channels install the same `spacedock` command from the bare `spacedock`
    # archive file, so only one may be linked at a time. Declaring the edge cask a
    # conflict makes brew refuse to install both at once — the channel-switch model
    # (uninstall one, install the other). The stable cask keeps the default binary
    # stanza: its cask name already equals the archive file.
    conflicts:
      - cask: spacedock@next
    repository:
      owner: spacedock-dev
      name: homebrew-tap
      # PAT with write access to the tap repo; the default GITHUB_TOKEN is scoped
      # to the release repo and cannot push the cross-repo cask bump.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/spacedock-dev/spacedock
    description: Workflow launcher and first-officer dispatch for agentic dev
    license: Apache-2.0
    # agentsview is a core Homebrew cask (Homebrew/homebrew-cask), so brew
    # resolves and installs it alongside the launcher — it powers
    # /spacedock:survey. safehouse stays a caveat (below): it lives in a
    # third-party tap (eugene1g/safehouse), which Homebrew 6.0 tap-trust refuses
    # to auto-load as a transitive depends_on, so we name the install command
    # rather than declare a dependency that would break the fresh-install path.
    dependencies:
      - cask: agentsview
    caveats: |
      Recommended companion (install separately):
        safehouse  — sandboxes agent runs (https://agent-safehouse.dev)
        brew install eugene1g/safehouse/agent-safehouse
    hooks:
      # The binary is adhoc/linker-signed only (not notarized), so the cask
      # download carries com.apple.quarantine and Gatekeeper kills the first
      # launch. Strip the attribute from the staged binary so the user needs no
      # manual step. Interim until a Developer ID notarized build lands.
      #
      # The cask ships linux URLs too (goreleaser emits them from the linux
      # archives), so this postflight also runs on a `brew install` on linux —
      # where `/usr/bin/xattr` does not exist and the hook aborts the install
      # with exit 127. Guard on OS.mac? so the quarantine strip is a no-op off
      # macOS (there is no quarantine attribute to strip there anyway).
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/spacedock"]
          end
  # The EDGE cask: `brew install spacedock-dev/tap/spacedock@next` ships the
  # devBranch=next binary that installs the `next` plugin. Its on-demand re-pull
  # cadence rides the unchanged next-publish.yml; goreleaser only emits the cask.
  - name: spacedock@next
    # Skip final tags. Publish only prerelease tags, where `.Prerelease` is not
    # empty. This is the inverse of the stable cask's `auto` routing.
    skip_upload: '{{ eq .Prerelease "" }}'
    ids:
      - spacedock-edge
    # The archive ships the binary as `spacedock`, so the edge command is also
    # `spacedock` — pin the binary stanza explicitly because the default would be
    # the cask name `spacedock@next`, which has no matching file in the archive.
    # Both channels install the same `spacedock` command, so the edge cask declares
    # the stable cask a conflict: brew installs one channel at a time (uninstall to
    # switch).
    binaries:
      - spacedock
    conflicts:
      - cask: spacedock
    repository:
      owner: spacedock-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/spacedock-dev/spacedock
    description: Workflow launcher and first-officer dispatch for agentic dev (edge channel)
    license: Apache-2.0
    # Same companion split as the stable cask: agentsview is a brew-installable
    # cask dependency; safehouse lives in a third-party tap that 6.0 tap-trust
    # won't auto-load as a transitive dep, so it stays a caveat naming its
    # install command.
    dependencies:
      - cask: agentsview
    caveats: |
      Recommended companion (install separately):
        safehouse  — sandboxes agent runs (https://agent-safehouse.dev)
        brew install eugene1g/safehouse/agent-safehouse
    hooks:
      # Same quarantine strip as the stable cask, guarded on OS.mac? so the
      # linux `brew install` path does not abort on the missing /usr/bin/xattr.
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/spacedock"]
          end

snapshot:
  # Used by `goreleaser release --snapshot --clean` (the dry-run oracle). The
  # stamp the built binary reports comes from this template when there is no tag.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
